name: Build and Serve Database

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/*.pkl"
      - "data/**"
      - "pyproject.toml"
      - ".github/workflows/serve_database.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Dependencies
        run: uv sync --all-extras --all-groups

      - name: Build Pan-Species Database (kbank.sqlite & kbank.parquet)
        run: |
          uv run python -m kbank.db.builder --out-dir data/

      - name: Run Database Integrity Tests
        run: |
          uv run pytest tests/test_pan_database.py -v

      - name: Upload Binary Database Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kbank-db-artifacts
          path: |
            data/kbank.sqlite
            data/kbank.parquet
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release CDN
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            data/kbank.sqlite
            data/kbank.parquet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Export Shinylive Serverless Web App
        run: |
          mkdir -p site
          uv run shinylive export src/kbank/app site/
          cp data/kbank.parquet site/
          touch site/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
