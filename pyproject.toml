[project]
name = "kbank"
dynamic = ["version"]
keywords = ["bioinformatics", "genomics", "serotyping", "microbiology"]
license = { file = "LICENSE" }
description = "Geno-glycomic database for bacterial glycans"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Tom Stanton", email = "tomdstanton@gmail.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "scipy",
    "serogen",
]

[project.optional-dependencies]
db = [
    "duckdb>=1.5.5",
    "pyarrow>=25.0.1",
]
curation = [
    "aiohttp>=3.14.3",
    "h2>=4.4.1",
    "httpx2>=2.13.0",
    "gb-io",
]
all = ["kbank[db,curation]"]

[dependency-groups]
docs = [
    "zensical",
    "mkdocstrings[python]",
    "zenzic",  # For checking the docs
]
test = [
    "pytest",
    "hypothesis",
]
typing = [
    "ty",
]
lint = [
    "ruff",
]
dev = [
    "kbank[all]",
    { include-group = "docs" },
    { include-group = "test" },
    { include-group = "typing" },
    { include-group = "lint" },
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/kbank/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kbank"]

[tool.ruff]
line-length = 120
exclude = [".agents", ".git", ".venv", "__pycache__", "src/kbank/_version.py"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]
extend-select = ["ANN", "PYI"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["src"]
exclude = ["notebooks/**"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
deprecated = "ignore"


[tool.uv.sources]
serogen = { path = "../SeroGen", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[profile.default.test]
test-function-prefix = "test"
retry = 1

[profile.ci.test]
retry = 5
no-tests = "fail"

[profile.ci.terminal]
output-format = "concise"