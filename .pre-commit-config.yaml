repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
        require_serial: true

      - id: ty
        name: ty check
        entry: uv run --no-sync ty check src/
        language: system
        types: [python]
        pass_filenames: false
