[project]
name = "kbank"
dynamic = ["version"]
keywords = ["bioinformatics", "genomics", "serotyping", "microbiology"]
license = { file = "LICENSE" }
description = "Geno-glycomic database for bacterial glycans"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Tom Stanton", email = "tomdstanton@gmail.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "serogen",
]

[dependency-groups]
docs = [
    "zensical",
    "mkdocstrings[python]",
    "zenzic>=0.30.0; python_version < '3.14'",
    "marimo>=0.25.1",
    "altair>=5.5.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-testmon>=2.1.0",
    "pytest-xdist",
    "pytest-cov>=7.1.0",
    "cassetter>=0.1.0",
    "httpx2[http2]>=2.13.0",
]
typing = [
    "ty",
]
lint = [
    "ruff",
    "pre-commit"
]
dev = [
    { include-group = "docs" },
    { include-group = "test" },
    { include-group = "typing" },
    { include-group = "lint" },
]

[project.urls]
Homepage = "https://seroverse.github.io/kbank/"
Repository = "https://github.com/seroverse/kbank"
Documentation = "https://seroverse.github.io/kbank/"
"Bug Tracker" = "https://github.com/seroverse/kbank/issues"
Changelog = "https://github.com/seroverse/kbank/blob/master/CHANGELOG.md"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/kbank/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kbank"]

[tool.ruff]
line-length = 120
force-exclude = true
exclude = [
    ".agents",
    ".git",
    ".venv",
    "__pycache__",
    "src/kbank/_version.py",
]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
extend-select = ["ANN", "PYI"]
ignore = [
    "ANN401",
    "E501",
] # Formatting handles line length
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["ANN", "B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.uv.sources]
serogen = { path = "../SeroGen", editable = true }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
norecursedirs = [".venv", "dist", "build", ".agy", ".git", ".ruff_cache"]
# Token-saving flags: suppress header/summary noise, truncate tracebacks, silence passing output
addopts = "-q --tb=short --show-capture=no --cov=src --cov-report=term-missing --cov-branch -n auto"
markers = [
    "max_span_ms(span_name, max_duration_ms): Assert span duration budget.",
]

[tool.zenzic]
strict = false
fail_under = 60

[tool.zenzic.build_context]
engine         = "zensical"
base_url       = "/"
default_locale = "en"

[tool.zenzic.governance]
suppression_cap           = 30
suppression_cap_fail_hard = true
brand_obsolescence = []

[tool.zenzic.governance.directory_policies]
"docs/**" = ["Z301"]  # mkdocstrings cross-references
"docs/reference/**" = ["Z411", "Z502"]  # autogenerated API stubs
"docs/releases.md" = ["Z411", "Z512", "Z513", "Z515"]  # GitHub release notes
"docs/conduct.md" = ["Z411", "Z502"]  # community stubs
"docs/contributing.md" = ["Z411", "Z502"]  # community stubs

[tool.zenzic.policies]
required_frontmatter_keys = []
forbidden_external_domains = []
forbidden_frontmatter_keys = []
allowed_external_domains = []
required_url_schemes = []
forbidden_content_patterns = []
required_heading_patterns = []
max_document_complexity = 0
weasel_words = []
enable_passive_voice_check = false

[tool.zenzic.network]
cache_ttl_hours = 24
